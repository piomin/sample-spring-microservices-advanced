name: OpenCode review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Get PR information
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
    
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
    
          gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json url,title,headRefName,baseRefName \
            > "$RUNNER_TEMP/pr.json"
    
          cat "$RUNNER_TEMP/pr.json"

      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false

      - name: Create Google credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" \
            > "$RUNNER_TEMP/gcp-credentials.json"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_VERTEX_PROJECT: ${{ secrets.GOOGLE_VERTEX_PROJECT }}
          GOOGLE_VERTEX_LOCATION: ${{ secrets.GOOGLE_VERTEX_LOCATION }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-credentials.json
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: google-vertex-anthropic/claude-sonnet-4-6@default
          use_github_token: true
          prompt: |
            Review pull request #${{ inputs.pr_number }}.
    
            Repository: ${{ github.repository }}
    
            Review the checked-out pull request for:
            - potential bugs
            - correctness issues
            - security problems
            - code quality issues
            - problematic edge cases
            - unnecessary complexity
    
            Focus on actionable findings that are relevant to the
            changes in this pull request.
    
            Post the review findings to pull request #${{ inputs.pr_number }}.